services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    networks:
      - internal
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  core-api:
    image: ${DOCKERHUB_USERNAME}/racko-core-api:latest
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      mongo:
        condition: service_healthy
        required: false
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      # Use MONGODB_URI from .env (e.g. Atlas). For local mongo, set:
      # mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DB_NAME}?authSource=admin
      MONGODB_URI: ${MONGODB_URI}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:5000/health > /dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  cloud-gateway:
    image: ${DOCKERHUB_USERNAME}/racko-cloud-gateway:latest
    restart: unless-stopped
    networks:
      - internal
      - public
    depends_on:
      core-api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      CORE_API_URL: http://core-api:5000
      JWT_ACCESS_EXPIRES_IN: 15m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:4000/health > /dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  client-portal:
    image: ${DOCKERHUB_USERNAME}/racko-client-portal:latest
    restart: unless-stopped
    networks:
      - public
    depends_on:
      cloud-gateway:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/ > /dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks:
      - public
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      client-portal:
        condition: service_healthy
      cloud-gateway:
        condition: service_healthy

networks:
  internal:
    driver: bridge
  public:
    driver: bridge

volumes:
  mongo_data:
