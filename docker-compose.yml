version: '3.9'
 
services:
  core-api:
    build:
      context: .
      dockerfile: core-api/Dockerfile
    image: gisuldocker/racko-core-api:${IMAGE_TAG:-dev}
    env_file:
      - core-api/.env
    environment:
      NODE_ENV: production
      PORT: ${CORE_API_PORT:-8001}
      JWT_ACCESS_EXPIRES_IN: ${CORE_API_JWT_ACCESS_EXPIRES_IN:-2m}
      TENANT_ASSETS_VOLUME_PATH: /data/tenant-assets
    volumes:
      - tenant-assets:/data/tenant-assets
      - ./agent/dist:/agent/dist:ro
    ports:
      - "${CORE_API_PORT:-8001}:8001"
 
  cloud-automation:
    image: gisuldocker/racko-cloud-automation:${IMAGE_TAG:-dev}
    env_file:
      - cloud-automation/.env
    environment:
      PORT: ${CLOUD_AUTOMATION_PORT:-3002}
    ports:
      - "${CLOUD_AUTOMATION_PORT:-3002}:3002"
 
  cloud-automation-aws:
    image: gisuldocker/racko-cloud-automation-aws:${IMAGE_TAG:-dev}
    env_file:
      - cloud-automation-aws/.env
    environment:
      PORT: ${CLOUD_AUTOMATION_AWS_PORT:-3003}
    ports:
      - "${CLOUD_AUTOMATION_AWS_PORT:-3003}:3003"
 
  cloud-gateway:
    build:
      context: .
      dockerfile: cloud-gateway/Dockerfile
    image: gisuldocker/racko-cloud-gateway:${IMAGE_TAG:-dev}
    env_file:
      - cloud-gateway/.env
    environment:
      PORT: ${GATEWAY_PORT:-8000}
      JWT_ACCESS_EXPIRES_IN: ${GATEWAY_JWT_ACCESS_EXPIRES_IN:-15m}
    depends_on:
      - core-api
      - cloud-automation
      - cloud-automation-aws
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
 
  client-portal:
    build:
      context: .
      dockerfile: client-portal/Dockerfile
    image: gisuldocker/racko-client-portal:${IMAGE_TAG:-dev}
    env_file:
      - client-portal/.env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: ${CLIENT_PORTAL_PORT:-3000}
      GATEWAY_INTERNAL_URL: http://cloud-gateway:8000
      CREATE_VM_AGENT_URL: http://create-vm-catalog-agent:3789
    depends_on:
      - cloud-gateway
      - create-vm-catalog-agent
    ports:
      - "${CLIENT_PORTAL_PORT:-3000}:3000"

  create-vm-catalog-agent:
    build:
      context: .
      dockerfile: create-vm-catalog-agent/Dockerfile
    image: gisuldocker/racko-create-vm-catalog-agent:${IMAGE_TAG:-dev}
    env_file:
      - create-vm-catalog-agent/.env
    environment:
      NODE_ENV: production
      PORT: ${CREATE_VM_CATALOG_AGENT_PORT:-3789}
      HOSTNAME: 0.0.0.0
      # When true, skip warm-up login on container start (useful during recovery)
      SKIP_CATALOG_AGENT_WARMUP: ${SKIP_CATALOG_AGENT_WARMUP:-false}
    ports:
      - "${CREATE_VM_CATALOG_AGENT_PORT:-3789}:3789"
    volumes:
      # Persist Playwright storage state so repeated logins are not required
      - ./create-vm-catalog-agent/catalog-storage-state.json:/app/catalog-storage-state.json:rw
 
volumes:
  tenant-assets: