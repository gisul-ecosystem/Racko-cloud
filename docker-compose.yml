services:
  core-api:
    image: ${DOCKERHUB_USERNAME}/racko-core-api:${IMAGE_TAG:-dev}
    env_file:
      - .env
    environment:
      PORT: ${CORE_API_PORT:-8001}
      JWT_ACCESS_EXPIRES_IN: ${CORE_API_JWT_ACCESS_EXPIRES_IN:-2m}
      TENANT_ASSETS_VOLUME_PATH: /data/tenant-assets
    volumes:
      - tenant_assets:/data/tenant-assets
      - ./agent/dist:/agent/dist:ro
    ports:
      - "${CORE_API_PORT:-8001}:8001"

  cloud-automation:
    image: ${DOCKERHUB_USERNAME}/racko-cloud-automation:${IMAGE_TAG:-dev}
    env_file:
      - .env
    environment:
      PORT: ${CLOUD_AUTOMATION_PORT:-3002}
    ports:
      - "${CLOUD_AUTOMATION_PORT:-3002}:3002"

  cloud-automation-aws:
    image: ${DOCKERHUB_USERNAME}/racko-cloud-automation-aws:${IMAGE_TAG:-dev}
    env_file:
      - .env
    environment:
      PORT: ${CLOUD_AUTOMATION_AWS_PORT:-3003}
      CLIENT_PORTAL_URL: ${FRONTEND_URL}
    ports:
      - "${CLOUD_AUTOMATION_AWS_PORT:-3003}:3003"

  cloud-gateway:
    image: ${DOCKERHUB_USERNAME}/racko-cloud-gateway:${IMAGE_TAG:-dev}
    env_file:
      - .env
    environment:
      PORT: ${GATEWAY_PORT:-8000}
      JWT_ACCESS_EXPIRES_IN: ${GATEWAY_JWT_ACCESS_EXPIRES_IN:-15m}
    depends_on:
      - core-api
      - cloud-automation
      - cloud-automation-aws
    ports:
      - "${GATEWAY_PORT:-8000}:8000"

  client-portal:
    image: ${DOCKERHUB_USERNAME}/racko-client-portal:${IMAGE_TAG:-dev}
    env_file:
      - .env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: ${CLIENT_PORTAL_PORT:-3000}
    depends_on:
      - cloud-gateway
    ports:
      - "${CLIENT_PORTAL_PORT:-3000}:3000"

volumes:
  tenant_assets:
