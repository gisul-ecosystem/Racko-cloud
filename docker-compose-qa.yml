version: '3.9'
 
services:
  core-api:
    image: gisuldocker/racko-core-api:qa
    env_file:
      - core-api/.env
    environment:
      NODE_ENV: production
      PORT: ${CORE_API_PORT:-8001}
      JWT_ACCESS_EXPIRES_IN: ${CORE_API_JWT_ACCESS_EXPIRES_IN:-2m}
      TENANT_ASSETS_VOLUME_PATH: /data/tenant-assets
    volumes:
      - tenant-assets:/data/tenant-assets
      - ./agent/dist:/agent/dist:ro
    ports:
      - "${CORE_API_PORT:-8001}:8001"
    networks:
      - racko-network
    restart: unless-stopped
 
  cloud-automation:
    image: gisuldocker/racko-cloud-automation:qa
    env_file:
      - cloud-automation/.env
    environment:
      PORT: ${CLOUD_AUTOMATION_PORT:-3002}
    ports:
      - "${CLOUD_AUTOMATION_PORT:-3002}:3002"
    networks:
      - racko-network
    restart: unless-stopped
 
  cloud-automation-aws:
    image: gisuldocker/racko-cloud-automation-aws:qa
    env_file:
      - cloud-automation-aws/.env
    environment:
      PORT: ${CLOUD_AUTOMATION_AWS_PORT:-3003}
    ports:
      - "${CLOUD_AUTOMATION_AWS_PORT:-3003}:3003"
    networks:
      - racko-network
    restart: unless-stopped
 
  cloud-gateway:
    image: gisuldocker/racko-cloud-gateway:qa
    env_file:
      - cloud-gateway/.env
    environment:
      PORT: ${GATEWAY_PORT:-8000}
      JWT_ACCESS_EXPIRES_IN: ${GATEWAY_JWT_ACCESS_EXPIRES_IN:-15m}
    depends_on:
      - core-api
      - cloud-automation
      - cloud-automation-aws
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    networks:
      - racko-network
    restart: unless-stopped
 
  client-portal:
    image: gisuldocker/racko-client-portal:qa
    env_file:
      - client-portal/.env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: ${CLIENT_PORTAL_PORT:-3000}
      GATEWAY_INTERNAL_URL: http://cloud-gateway:8000
    depends_on:
      - cloud-gateway
    ports:
      - "${CLIENT_PORTAL_PORT:-3000}:3000"
    networks:
      - racko-network
    restart: unless-stopped
 
volumes:
  tenant-assets:
    name: racko-qa-tenant-assets
 
networks:
  racko-network:
    name: racko-qa-network
    driver: bridge