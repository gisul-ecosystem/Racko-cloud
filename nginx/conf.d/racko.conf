# Replace dev.racko.ai / api.dev.racko.ai with your real hostnames.
# TLS certificate paths assume certbot layout under /etc/letsencrypt.

upstream client_portal {
    server client-portal:3000;
}

upstream cloud_gateway {
    server cloud-gateway:4000;
}

# HTTP — ACME challenges + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dev.racko.ai api.dev.racko.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — marketing site / client portal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.racko.ai;

    ssl_certificate /etc/letsencrypt/live/dev.racko.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.racko.ai/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://client_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# HTTPS — API gateway
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.dev.racko.ai;

    ssl_certificate /etc/letsencrypt/live/api.dev.racko.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dev.racko.ai/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25m;

    location / {
        proxy_pass http://cloud_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
