version: '3.9'

services:
  core-api:
    image: gisuldocker/racko-core-api:uat
    env_file:
      - core-api/.env
    environment:
      NODE_ENV: production
      PORT: ${CORE_API_PORT:-8001}
      JWT_ACCESS_EXPIRES_IN: ${CORE_API_JWT_ACCESS_EXPIRES_IN:-2m}
      TENANT_ASSETS_VOLUME_PATH: /data/tenant-assets
      CREATE_VM_AGENT_URL: http://create-vm-catalog-agent:3789
    volumes:
      - tenant-assets:/data/tenant-assets
      - ./agent/dist:/agent/dist:ro
    ports:
      - "${CORE_API_PORT:-8001}:8001"
    networks:
      - racko-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  cloud-automation:
    image: gisuldocker/racko-cloud-automation:uat
    env_file:
      - cloud-automation/.env
    environment:
      PORT: ${CLOUD_AUTOMATION_PORT:-3002}
      BULK_PROVISION_CONCURRENCY: ${BULK_PROVISION_CONCURRENCY:-30}
      DELETE_AZURE_CONCURRENCY: ${DELETE_AZURE_CONCURRENCY:-30}
      RESOURCE_GROUP_BATCH_SIZE: ${RESOURCE_GROUP_BATCH_SIZE:-25}
      USER_PROVISION_BATCH_SIZE: ${USER_PROVISION_BATCH_SIZE:-25}
      ROLE_PROVISION_BATCH_SIZE: ${ROLE_PROVISION_BATCH_SIZE:-25}
      MAX_PROVISION_ACCOUNT_COUNT: ${MAX_PROVISION_ACCOUNT_COUNT:-1000}
      PROVISION_STEP_TIME_BUDGET_MS: ${PROVISION_STEP_TIME_BUDGET_MS:-0}
      SUPABASE_DB_STATEMENT_TIMEOUT_MS: ${SUPABASE_DB_STATEMENT_TIMEOUT_MS:-0}
      SUPABASE_DB_QUERY_TIMEOUT_MS: ${SUPABASE_DB_QUERY_TIMEOUT_MS:-0}
      SIGNIN_STALE_SESSION_MINUTES: ${SIGNIN_STALE_SESSION_MINUTES:-90}
      SIGNIN_MONITOR_LOOKBACK_MINUTES: ${SIGNIN_MONITOR_LOOKBACK_MINUTES:-180}
    ports:
      - "${CLOUD_AUTOMATION_PORT:-3002}:3002"
    networks:
      - racko-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  cloud-automation-aws:
    image: gisuldocker/racko-cloud-automation-aws:uat
    env_file:
      - cloud-automation-aws/.env
    environment:
      PORT: ${CLOUD_AUTOMATION_AWS_PORT:-3003}
    ports:
      - "${CLOUD_AUTOMATION_AWS_PORT:-3003}:3003"
    networks:
      - racko-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  cloud-gateway:
    image: gisuldocker/racko-cloud-gateway:uat
    env_file:
      - cloud-gateway/.env
    environment:
      PORT: ${GATEWAY_PORT:-8000}
      JWT_ACCESS_EXPIRES_IN: ${GATEWAY_JWT_ACCESS_EXPIRES_IN:-15m}
    depends_on:
      core-api:
        condition: service_healthy
      cloud-automation:
        condition: service_healthy
      cloud-automation-aws:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    networks:
      - racko-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  client-portal:
    image: gisuldocker/racko-client-portal:uat
    env_file:
      - client-portal/.env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: ${CLIENT_PORTAL_PORT:-3000}
      GATEWAY_INTERNAL_URL: http://cloud-gateway:8000
      CREATE_VM_AGENT_URL: http://create-vm-catalog-agent:3789
    depends_on:
      cloud-gateway:
        condition: service_healthy
      create-vm-catalog-agent:
        condition: service_started
    ports:
      - "${CLIENT_PORTAL_PORT:-3000}:3000"
    networks:
      - racko-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  create-vm-catalog-agent:
    image: gisuldocker/racko-create-vm-catalog-agent:uat
    env_file:
      - create-vm-catalog-agent/.env
    environment:
      NODE_ENV: production
      PORT: ${CREATE_VM_CATALOG_AGENT_PORT:-3789}
      HOSTNAME: 0.0.0.0
    ports:
      - "${CREATE_VM_CATALOG_AGENT_PORT:-3789}:3789"
    networks:
      - racko-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3789/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  tenant-assets:
    name: racko-uat-tenant-assets

networks:
  racko-network:
    name: racko-uat-network
    driver: bridge

