name: Build and Deploy

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

concurrency:
  group: racko-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: client-portal
            context: client-portal
            image_suffix: client-portal
          - service: core-api
            context: core-api
            image_suffix: core-api
          - service: cloud-gateway
            context: cloud-gateway
            image_suffix: cloud-gateway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/racko-${{ matrix.image_suffix }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/racko-${{ matrix.image_suffix }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_GATEWAY_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/deploy_key -T ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "set -e
            cd /opt/racko-cloud
            docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' -p '${{ secrets.DOCKERHUB_TOKEN }}'
            docker compose pull
            docker compose up -d --no-deps core-api
            sleep 10
            docker compose up -d --no-deps cloud-gateway
            sleep 10
            docker compose up -d --no-deps client-portal
            sleep 10
            docker compose up -d --no-deps nginx
            docker compose ps
            docker image prune -f"
            