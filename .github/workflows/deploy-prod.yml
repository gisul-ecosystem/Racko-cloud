# GitHub secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME   — Docker Hub username
#   DOCKERHUB_TOKEN      — Docker Hub access token (read/write)
#
# Deploy runs on the self-hosted runner on the production VM:
#   name:   racko-prod
#   labels: self-hosted, linux, racko-prod
#   work:   _work
#
# Service env files live on the VM under /opt/racko/<service>/.env
# (e.g. cloud-automation/.env, cloud_automation_reseller/.env) — not in GitHub secrets.
# client-portal bakes NEXT_PUBLIC_GATEWAY_URL to the public API (e.g. https://api.racko.ai).
# Nginx must proxy /api/ → 127.0.0.1:8000 on racko.ai and each tenant domain
# (proxy_read_timeout >= 300s). Only 80/443 should be public; app ports bind to localhost.

name: Build & Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  IMAGE_TAG: production
  DEPLOY_PATH: /opt/racko

jobs:
  build-core-api:
    name: Build & Push core-api
    runs-on: ubuntu-latest
    needs: build-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download agent checksum artifacts
        uses: actions/download-artifact@v4
        with:
          path: agent-artifacts

      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build core-api image
        run: |
          CHECKSUM_WINDOWS=$(cat agent-artifacts/agent-windows/checksum-windows.txt | tr -d '[:space:]')
          CHECKSUM_LINUX=$(cat agent-artifacts/agent-linux/checksum-linux.txt | tr -d '[:space:]')
          AGENT_VERSION=$(cat agent-artifacts/agent-linux/agent-version.txt | tr -d '[:space:]')
          RACKO_APP_VERSION=$(cat agent-artifacts/agent-windows/racko-app-version.txt | tr -d '[:space:]')
          RACKO_APP_CHECKSUM=$(cat agent-artifacts/agent-windows/racko-app-checksum.txt | tr -d '[:space:]')
          docker build \
            --build-arg AGENT_VERSION=$AGENT_VERSION \
            --build-arg AGENT_CHECKSUM_WINDOWS=$CHECKSUM_WINDOWS \
            --build-arg AGENT_CHECKSUM_LINUX=$CHECKSUM_LINUX \
            --build-arg RACKO_APP_VERSION=$RACKO_APP_VERSION \
            --build-arg RACKO_APP_CHECKSUM=$RACKO_APP_CHECKSUM \
            -t ${{ env.DOCKERHUB_USERNAME }}/racko-core-api:production \
            -f core-api/Dockerfile core-api/

      - name: Push core-api image
        run: docker push ${{ env.DOCKERHUB_USERNAME }}/racko-core-api:production

  build-cloud-gateway:
    name: Build & Push cloud-gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build cloud-gateway image
        run: docker build -t ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-gateway:production -f cloud-gateway/Dockerfile cloud-gateway/

      - name: Push cloud-gateway image
        run: docker push ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-gateway:production

  build-cloud-automation:
    name: Build & Push cloud-automation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build cloud-automation image
        run: docker build -t ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation:production -f cloud_automation/Dockerfile cloud_automation/

      - name: Push cloud-automation image
        run: docker push ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation:production

  build-cloud-automation-aws:
    name: Build & Push cloud-automation-aws
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build cloud-automation-aws image
        run: docker build -t ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-aws:production -f cloud_automation_aws/Dockerfile cloud_automation_aws/

      - name: Push cloud-automation-aws image
        run: docker push ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-aws:production

  build-cloud-automation-reseller:
    name: Build & Push cloud-automation-reseller
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build cloud-automation-reseller image
        run: docker build -t ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-reseller:production -f cloud_automation_reseller/Dockerfile cloud_automation_reseller/

      - name: Push cloud-automation-reseller image
        run: docker push ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-reseller:production

  build-cloud-automation-training:
    name: Build & Push cloud-automation-training
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build cloud-automation-training image
        run: docker build -t ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-training:production -f cloud_automation_training/Dockerfile cloud_automation_training/

      - name: Push cloud-automation-training image
        run: docker push ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-training:production

  build-client-portal:
    name: Build & Push client-portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build client-portal image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_VM_MAX_BULK_COUNT=50 \
            --build-arg NEXT_PUBLIC_GATEWAY_URL=https://api.racko.ai \
            -t ${{ env.DOCKERHUB_USERNAME }}/racko-client-portal:production \
            -f client-portal/Dockerfile client-portal/

      - name: Push client-portal image
        run: docker push ${{ env.DOCKERHUB_USERNAME }}/racko-client-portal:production

  build-create-vm-catalog-agent:
    name: Build & Push create-vm-catalog-agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build create-vm-catalog-agent image
        run: docker build -t ${{ env.DOCKERHUB_USERNAME }}/racko-create-vm-catalog-agent:production -f create-vm-catalog-agent/Dockerfile create-vm-catalog-agent/

      - name: Push create-vm-catalog-agent image
        run: docker push ${{ env.DOCKERHUB_USERNAME }}/racko-create-vm-catalog-agent:production

  build-agent:
    name: Build Agent Binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            output: racko-agent
            goos: linux
            goarch: amd64
          - os: windows-latest
            platform: windows
            output: racko-agent.exe
            goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod

      - name: Read agent version
        id: agent-version
        shell: bash
        working-directory: agent
        run: echo "VERSION=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Build agent binary
        working-directory: agent
        shell: bash
        run: |
          LDFLAGS="-X github.com/racko-ai/agent/config.LDPlatformURL=https://api.racko.ai -X github.com/racko-ai/agent/config.Version=${{ steps.agent-version.outputs.VERSION }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            LDFLAGS="$LDFLAGS -H windowsgui"
          fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -ldflags "$LDFLAGS" -o dist/${{ matrix.output }} .

      - name: Build racko-app GUI binary (Windows only)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $RACKO_APP_VERSION = (Get-Content racko-app/VERSION -Raw).Trim()
          dotnet publish racko-app/RackoApp.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishReadyToRun=true `
            -p:Version=$RACKO_APP_VERSION `
            -p:InformationalVersion=$RACKO_APP_VERSION `
            -o racko-app/publish
          # 1. Zip for VM push flow (push script downloads + extracts this)
          Compress-Archive -Path racko-app/publish/* -DestinationPath agent/dist/racko-app.zip -Force
          # 2. Copy folder to agent/dist/racko-app/ for Inno Setup bundling
          New-Item -ItemType Directory -Force -Path agent/dist/racko-app | Out-Null
          Copy-Item -Path racko-app/publish/* -Destination agent/dist/racko-app/ -Recurse -Force

      - name: Compute and save checksum (Linux)
        if: matrix.platform == 'linux'
        working-directory: agent
        shell: bash
        run: |
          CHECKSUM=$(sha256sum dist/racko-agent | awk '{print $1}')
          echo "AGENT_CHECKSUM_LINUX=$CHECKSUM" >> $GITHUB_STEP_SUMMARY
          echo "$CHECKSUM" > dist/checksum-linux.txt
          cp VERSION dist/agent-version.txt

      - name: Compute and save checksum (Windows)
        if: matrix.platform == 'windows'
        working-directory: agent
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/racko-agent.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Windows binary SHA256: $hash"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "AGENT_CHECKSUM_WINDOWS=$hash"
          Set-Content -Path dist/checksum-windows.txt -Value $hash
          $appHash = (Get-FileHash dist/racko-app.zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "racko-app.zip SHA256: $appHash"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "RACKO_APP_CHECKSUM=$appHash"
          Set-Content -Path dist/racko-app-checksum.txt -Value $appHash
          $appVer = (Get-Content ../racko-app/VERSION -Raw).Trim()
          Set-Content -Path dist/racko-app-version.txt -Value $appVer
          cp VERSION dist/agent-version.txt

      - name: Build Windows installer (Windows only)
        if: matrix.platform == 'windows'
        working-directory: agent
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DPlatformURL=https://api.racko.ai" "installer\racko-agent-setup.iss"

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.platform }}
          path: |
            agent/dist/${{ matrix.output }}
            agent/dist/checksum-${{ matrix.platform }}.txt
            agent/dist/agent-version.txt
            ${{ matrix.platform == 'windows' && 'agent/dist/racko-agent-setup.exe' || '' }}
            ${{ matrix.platform == 'windows' && 'agent/dist/racko-app.zip' || '' }}
            ${{ matrix.platform == 'windows' && 'agent/dist/racko-app-checksum.txt' || '' }}
            ${{ matrix.platform == 'windows' && 'agent/dist/racko-app-version.txt' || '' }}
          retention-days: 1

  deploy-agent:
    name: Deploy Agent Binaries
    runs-on: [self-hosted, linux, racko-prod]
    needs: build-agent
    steps:
      - name: Download all agent artifacts
        uses: actions/download-artifact@v4
        with:
          path: agent-artifacts

      - name: Install agent binaries
        run: |
          set -e
          sudo mkdir -p "${DEPLOY_PATH}/agent/dist"
          sudo cp agent-artifacts/agent-linux/racko-agent \
            "${DEPLOY_PATH}/agent/dist/racko-agent"
          sudo chmod +x "${DEPLOY_PATH}/agent/dist/racko-agent"
          sudo cp agent-artifacts/agent-windows/racko-agent.exe \
            "${DEPLOY_PATH}/agent/dist/racko-agent.exe"
          sudo cp agent-artifacts/agent-windows/racko-agent-setup.exe \
            "${DEPLOY_PATH}/agent/dist/racko-agent-setup.exe"
          # GUI tray app zip (folder-publish — WebView2Loader.dll must be loose on disk)
          sudo cp agent-artifacts/agent-windows/racko-app.zip \
            "${DEPLOY_PATH}/agent/dist/racko-app.zip"
          echo "Agent binaries installed to ${DEPLOY_PATH}/agent/dist/"

  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, linux, racko-prod]
    needs:
      - build-core-api
      - build-cloud-gateway
      - build-cloud-automation
      - build-cloud-automation-aws
      - build-cloud-automation-reseller
      - build-cloud-automation-training
      - build-client-portal
      - build-create-vm-catalog-agent
      - deploy-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install compose file
        run: |
          set -e
          sudo mkdir -p "${DEPLOY_PATH}"
          sudo cp docker-compose-prod.yml "${DEPLOY_PATH}/docker-compose.yml"
          echo "docker-compose-prod.yml installed to ${DEPLOY_PATH}/docker-compose.yml"

      - name: Deploy (pull new images + restart)
        run: |
          set -e
          echo 'Cleaning up Docker system...'
          sudo docker system prune -a --volumes -f
          sudo docker container prune -f
          sudo docker image prune -a -f
          sudo docker volume prune -f
          echo 'Cleaning Docker logs...'
          sudo find /var/lib/docker/containers -name '*.log' -delete || true
          echo 'Cleaning journal logs...'
          sudo journalctl --vacuum-size=100M || true
          echo 'Cleaning apt cache...'
          sudo apt clean || true
          sudo apt autoclean || true
          echo 'Disk usage after cleanup:'
          df -h
          export DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME}"
          export IMAGE_TAG=production
          echo 'Docker login...'
          echo "${DOCKERHUB_TOKEN}" | sudo docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
          echo 'Deploying...'
          sudo docker-compose -f "${DEPLOY_PATH}/docker-compose.yml" down --remove-orphans
          sudo docker-compose -f "${DEPLOY_PATH}/docker-compose.yml" pull
          sudo docker-compose -f "${DEPLOY_PATH}/docker-compose.yml" up -d
          sudo docker-compose -f "${DEPLOY_PATH}/docker-compose.yml" ps

      - name: Summary
        run: |
          echo "Build & Deploy Production Complete!"
          echo "Deploy path: ${DEPLOY_PATH}"
          echo "Public entry: https via nginx on 80/443 only"
          echo "Client portal (local):  http://127.0.0.1:3000"
          echo "Cloud gateway (local):  http://127.0.0.1:8000"
          echo "Core API (local):       http://127.0.0.1:8001"
          echo "Azure service (local):  http://127.0.0.1:3002"
          echo "AWS service (local):    http://127.0.0.1:3003"
          echo "Reseller svc (local):   http://127.0.0.1:3005"
          echo "Training svc (local):  http://127.0.0.1:3006"
