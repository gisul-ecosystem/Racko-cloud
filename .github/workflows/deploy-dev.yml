# GitHub secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME   — Docker Hub username
#   DOCKERHUB_TOKEN    — Docker Hub access token (read/write)
#   VM_HOST_DEV        — VM public IP or hostname (e.g. 103.99.38.157)
#   VM_USER_DEV        — SSH user (e.g. ubuntu)
#   VM_SSH_KEY_DEV     — Private SSH key for the VM user
#
# Service env files live on the VM under /opt/racko/<service>/.env (e.g. cloud-automation/.env, cloud_automation_reseller/.env) — not in GitHub secrets.
# client-portal bakes NEXT_PUBLIC_GATEWAY_URL to the public API (e.g. https://api-dev.racko.ai).
# cloud-automation large-lab batch sizes are also set in docker-compose.yml (defaults: 25).
# Nginx must proxy /api/ → :8000 on dev.racko.ai and each tenant domain (proxy_read_timeout >= 300s).
 
name: Build & Deploy Dev via SSH
 
on:
  push:
    branches: [dev]
  workflow_dispatch:
 
env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  IMAGE_TAG: ${{ github.sha }}
 
jobs:
  build-core-api:
    name: Build & Push core-api
    runs-on: ubuntu-latest
    needs: build-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download agent checksum artifacts
        uses: actions/download-artifact@v4
        with:
          path: agent-artifacts

      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build core-api image
        run: |
          CHECKSUM_WINDOWS=$(cat agent-artifacts/agent-windows/checksum-windows.txt | tr -d '[:space:]')
          CHECKSUM_LINUX=$(cat agent-artifacts/agent-linux/checksum-linux.txt | tr -d '[:space:]')
          AGENT_VERSION=$(cat agent-artifacts/agent-linux/agent-version.txt | tr -d '[:space:]')
          docker build \
            --build-arg AGENT_VERSION=$AGENT_VERSION \
            --build-arg AGENT_CHECKSUM_WINDOWS=$CHECKSUM_WINDOWS \
            --build-arg AGENT_CHECKSUM_LINUX=$CHECKSUM_LINUX \
            -t ${{ env.DOCKERHUB_USERNAME }}/racko-core-api:${{ env.IMAGE_TAG }} \
            -t ${{ env.DOCKERHUB_USERNAME }}/racko-core-api:dev \
            -f core-api/Dockerfile core-api/

      - name: Push core-api image
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/racko-core-api:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKERHUB_USERNAME }}/racko-core-api:dev
 
  build-cloud-gateway:
    name: Build & Push cloud-gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin
 
      - name: Build cloud-gateway image
        run: docker build -t ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-gateway:${{ env.IMAGE_TAG }} -t ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-gateway:dev -f cloud-gateway/Dockerfile cloud-gateway/
 
      - name: Push cloud-gateway image
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-gateway:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-gateway:dev
 
  build-cloud-automation:
    name: Build & Push cloud-automation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin
 
      - name: Build cloud-automation image
        run: docker build -t ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation:${{ env.IMAGE_TAG }} -t ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation:dev -f cloud_automation/Dockerfile cloud_automation/
 
      - name: Push cloud-automation image
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation:dev
 
  build-cloud-automation-aws:
    name: Build & Push cloud-automation-aws
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build cloud-automation-aws image
        run: docker build -t ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-aws:${{ env.IMAGE_TAG }} -t ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-aws:dev -f cloud_automation_aws/Dockerfile cloud_automation_aws/

      - name: Push cloud-automation-aws image
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-aws:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-aws:dev

  build-cloud-automation-reseller:
    name: Build & Push cloud-automation-reseller
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build cloud-automation-reseller image
        run: docker build -t ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-reseller:${{ env.IMAGE_TAG }} -t ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-reseller:dev -f cloud_automation_reseller/Dockerfile cloud_automation_reseller/

      - name: Push cloud-automation-reseller image
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-reseller:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-reseller:dev

  build-cloud-automation-training:
    name: Build & Push cloud-automation-training
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build cloud-automation-training image
        run: docker build -t ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-training:${{ env.IMAGE_TAG }} -t ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-training:dev -f cloud_automation_training/Dockerfile cloud_automation_training/

      - name: Push cloud-automation-training image
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-training:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-training:dev

  build-client-portal:
    name: Build & Push client-portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin
 
      - name: Build client-portal image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_VM_MAX_BULK_COUNT=50 \
            --build-arg NEXT_PUBLIC_GATEWAY_URL=https://api-dev.racko.ai \
            -t ${{ env.DOCKERHUB_USERNAME }}/racko-client-portal:${{ env.IMAGE_TAG }} \
            -t ${{ env.DOCKERHUB_USERNAME }}/racko-client-portal:dev \
            -f client-portal/Dockerfile client-portal/
 
      - name: Push client-portal image
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/racko-client-portal:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKERHUB_USERNAME }}/racko-client-portal:dev

  build-create-vm-catalog-agent:
    name: Build & Push create-vm-catalog-agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build create-vm-catalog-agent image
        run: docker build -t ${{ env.DOCKERHUB_USERNAME }}/racko-create-vm-catalog-agent:${{ env.IMAGE_TAG }} -t ${{ env.DOCKERHUB_USERNAME }}/racko-create-vm-catalog-agent:dev -f create-vm-catalog-agent/Dockerfile create-vm-catalog-agent/

      - name: Push create-vm-catalog-agent image
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/racko-create-vm-catalog-agent:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKERHUB_USERNAME }}/racko-create-vm-catalog-agent:dev
 
  build-agent:
    name: Build Agent Binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            output: racko-agent
            goos: linux
            goarch: amd64
          - os: windows-latest
            platform: windows
            output: racko-agent.exe
            goos: windows
            goarch: amd64
            ldflags_url: 'https://api-dev.racko.ai'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod

      - name: Read agent version
        id: agent-version
        shell: bash
        working-directory: agent
        run: echo "VERSION=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_OUTPUT

      - name: Build agent binary
        working-directory: agent
        shell: bash
        run: |
          LDFLAGS="-X github.com/racko-ai/agent/config.LDPlatformURL=https://api-dev.racko.ai -X github.com/racko-ai/agent/config.Version=${{ steps.agent-version.outputs.VERSION }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            LDFLAGS="$LDFLAGS -H windowsgui"
          fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -ldflags "$LDFLAGS" -o dist/${{ matrix.output }} .

      - name: Build racko-app GUI binary (Windows only)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          dotnet publish racko-app/RackoApp.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishReadyToRun=true `
            -o racko-app/publish
          # 1. Zip for VM push flow (push script downloads + extracts this)
          Compress-Archive -Path racko-app/publish/* -DestinationPath agent/dist/racko-app.zip -Force
          # 2. Copy folder to agent/dist/racko-app/ for Inno Setup bundling
          New-Item -ItemType Directory -Force -Path agent/dist/racko-app | Out-Null
          Copy-Item -Path racko-app/publish/* -Destination agent/dist/racko-app/ -Recurse -Force

      - name: Compute and save checksum (Linux)
        if: matrix.platform == 'linux'
        working-directory: agent
        shell: bash
        run: |
          CHECKSUM=$(sha256sum dist/racko-agent | awk '{print $1}')
          echo "AGENT_CHECKSUM_LINUX=$CHECKSUM" >> $GITHUB_STEP_SUMMARY
          echo "$CHECKSUM" > dist/checksum-linux.txt
          # Save VERSION so build-core-api can read it from the artifact
          cp VERSION dist/agent-version.txt

      - name: Compute and save checksum (Windows)
        if: matrix.platform == 'windows'
        working-directory: agent
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/racko-agent.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Windows binary SHA256: $hash"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "AGENT_CHECKSUM_WINDOWS=$hash"
          # Save to file artifact so deploy job can read it
          Set-Content -Path dist/checksum-windows.txt -Value $hash

      - name: Build Windows installer (Windows only)
        if: matrix.platform == 'windows'
        working-directory: agent
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DPlatformURL=https://api-dev.racko.ai" "installer\racko-agent-setup.iss"

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.platform }}
          path: |
            agent/dist/${{ matrix.output }}
            agent/dist/checksum-${{ matrix.platform }}.txt
            agent/dist/agent-version.txt
            ${{ matrix.platform == 'windows' && 'agent/dist/racko-agent-setup.exe' || '' }}
            ${{ matrix.platform == 'windows' && 'agent/dist/racko-app.zip' || '' }}
          retention-days: 1

  deploy-agent:
    name: Deploy Agent Binaries to VM
    runs-on: ubuntu-latest
    needs: build-agent
    env:
      VM_HOST: ${{ secrets.VM_HOST_DEV }}
      VM_USER: ${{ secrets.VM_USER_DEV }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY_DEV }}
      DEPLOY_PATH: /opt/racko
    steps:
      - name: Download all agent artifacts
        uses: actions/download-artifact@v4
        with:
          path: agent-artifacts

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${VM_SSH_KEY}" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          ssh-keyscan -H "${VM_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload agent binaries to VM
        run: |
          ssh -i ~/.ssh/vm_key -o StrictHostKeyChecking=no "${VM_USER}@${VM_HOST}" \
            "mkdir -p ${DEPLOY_PATH}/agent/dist"
          # Linux
          scp -i ~/.ssh/vm_key -o StrictHostKeyChecking=no \
            agent-artifacts/agent-linux/racko-agent \
            "${VM_USER}@${VM_HOST}:${DEPLOY_PATH}/agent/dist/racko-agent"
          # Windows binary
          scp -i ~/.ssh/vm_key -o StrictHostKeyChecking=no \
            agent-artifacts/agent-windows/racko-agent.exe \
            "${VM_USER}@${VM_HOST}:${DEPLOY_PATH}/agent/dist/racko-agent.exe"
          # Windows installer
          scp -i ~/.ssh/vm_key -o StrictHostKeyChecking=no \
            agent-artifacts/agent-windows/racko-agent-setup.exe \
            "${VM_USER}@${VM_HOST}:${DEPLOY_PATH}/agent/dist/racko-agent-setup.exe"
          # GUI tray app zip (folder-publish — WebView2Loader.dll must be loose on disk)
          scp -i ~/.ssh/vm_key -o StrictHostKeyChecking=no \
            agent-artifacts/agent-windows/racko-app.zip \
            "${VM_USER}@${VM_HOST}:${DEPLOY_PATH}/agent/dist/racko-app.zip"
          echo "Agent binaries uploaded to ${DEPLOY_PATH}/agent/dist/"

  deploy:
    name: Deploy to Dev VM
    # TEMPORARILY DISABLED — docker issue on dev VM, uncomment when fixed
    # if: false
    runs-on: ubuntu-latest
    needs:
      - build-core-api
      - build-cloud-gateway
      - build-cloud-automation
      - build-cloud-automation-aws
      - build-cloud-automation-reseller
      - build-cloud-automation-training
      - build-client-portal
      - build-create-vm-catalog-agent
      - deploy-agent
 
    env:
      VM_HOST: ${{ secrets.VM_HOST_DEV }}
      VM_USER: ${{ secrets.VM_USER_DEV }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY_DEV }}
      DEPLOY_PATH: /opt/racko
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${VM_SSH_KEY}" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          ssh-keyscan -H "${VM_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
 
      - name: Upload files to VM
        run: |
          ssh -i ~/.ssh/vm_key -o StrictHostKeyChecking=no "${VM_USER}@${VM_HOST}" "mkdir -p ${DEPLOY_PATH}"
          scp -i ~/.ssh/vm_key -o StrictHostKeyChecking=no docker-compose.yml "${VM_USER}@${VM_HOST}:${DEPLOY_PATH}/docker-compose.yml"
          echo "docker-compose.yml uploaded to ${DEPLOY_PATH}"
 
      - name: Deploy on VM (pull new images + restart)
        run: |
          ssh -i ~/.ssh/vm_key -o StrictHostKeyChecking=no "${VM_USER}@${VM_HOST}" \
            "set -e; \
             echo 'Cleaning up Docker system...'; \
             sudo docker system prune -a --volumes -f; \
             sudo docker container prune -f; \
             sudo docker image prune -a -f; \
             sudo docker volume prune -f; \
             echo 'Cleaning Docker logs...'; \
             sudo find /var/lib/docker/containers -name '*.log' -delete; \
             echo 'Cleaning journal logs...'; \
             sudo journalctl --vacuum-size=100M; \
             echo 'Cleaning apt cache...'; \
             sudo apt clean; \
             sudo apt autoclean; \
             echo 'Disk usage after cleanup:'; \
             df -h; \
             cd ${DEPLOY_PATH}; \
             export DOCKERHUB_USERNAME='${DOCKERHUB_USERNAME}'; \
             export IMAGE_TAG='dev'; \
             echo 'Docker login...'; \
             echo '${DOCKERHUB_TOKEN}' | sudo docker login -u '${DOCKERHUB_USERNAME}' --password-stdin; \
             echo 'Deploying...'; \
             sudo docker-compose -f docker-compose.yml down --remove-orphans; \
             sudo docker-compose -f docker-compose.yml pull; \
             sudo docker-compose -f docker-compose.yml up -d; \
             sudo docker-compose -f docker-compose.yml ps"
 
      - name: Summary
        run: |
          echo "Build & Deploy Dev Complete!"
          echo "Client portal:  http://${VM_HOST}:3000"
          echo "Cloud gateway:  http://${VM_HOST}:8000"
          echo "Core API:       http://${VM_HOST}:8001"
          echo "Azure service:  http://${VM_HOST}:3002"
          echo "AWS service:    http://${VM_HOST}:3003"
          echo "Reseller svc:   http://${VM_HOST}:3005"
          echo "Training svc:  http://${VM_HOST}:3006"
