# GitHub secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME   — Docker Hub username
#   DOCKERHUB_TOKEN      — Docker Hub access token (read/write)
#
# Deploy runs on the self-hosted runner on the QA VM:
#   name:   racko-qa
#   labels: self-hosted, linux, racko-qa
#   work:   _work
#
# Service env files live on the VM under /opt/racko/<service>/.env
# (e.g. cloud-automation/.env, cloud_automation_reseller/.env) — not in GitHub secrets.
# client-portal bakes NEXT_PUBLIC_GATEWAY_URL to the public API (e.g. https://api-qa.racko.ai).
# cloud-automation large-lab batch sizes are also set in docker-compose.yml (defaults: 25).
# Nginx must proxy /api/ → :8000 on qa.racko.ai and each tenant domain (proxy_read_timeout >= 300s).

name: Build & Deploy QA

on:
  push:
    branches: [QA]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  IMAGE_TAG: qa
  DEPLOY_PATH: /opt/racko

jobs:
  build-core-api:
    name: Build & Push core-api
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build core-api image
        run: docker build -t ${{ env.DOCKERHUB_USERNAME }}/racko-core-api:qa -f core-api/Dockerfile core-api/

      - name: Push core-api image
        run: docker push ${{ env.DOCKERHUB_USERNAME }}/racko-core-api:qa

  build-cloud-gateway:
    name: Build & Push cloud-gateway
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build cloud-gateway image
        run: docker build -t ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-gateway:qa -f cloud-gateway/Dockerfile cloud-gateway/

      - name: Push cloud-gateway image
        run: docker push ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-gateway:qa

  build-cloud-automation:
    name: Build & Push cloud-automation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build cloud-automation image
        run: docker build -t ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation:qa -f cloud_automation/Dockerfile cloud_automation/

      - name: Push cloud-automation image
        run: docker push ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation:qa

  build-cloud-automation-aws:
    name: Build & Push cloud-automation-aws
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build cloud-automation-aws image
        run: docker build -t ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-aws:qa -f cloud_automation_aws/Dockerfile cloud_automation_aws/

      - name: Push cloud-automation-aws image
        run: docker push ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-aws:qa

  build-cloud-automation-reseller:
    name: Build & Push cloud-automation-reseller
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build cloud-automation-reseller image
        run: docker build -t ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-reseller:qa -f cloud_automation_reseller/Dockerfile cloud_automation_reseller/

      - name: Push cloud-automation-reseller image
        run: docker push ${{ env.DOCKERHUB_USERNAME }}/racko-cloud-automation-reseller:qa

  build-client-portal:
    name: Build & Push client-portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build client-portal image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_VM_MAX_BULK_COUNT=50 \
            --build-arg NEXT_PUBLIC_GATEWAY_URL=https://api-qa.racko.ai \
            -t ${{ env.DOCKERHUB_USERNAME }}/racko-client-portal:qa \
            -f client-portal/Dockerfile client-portal/

      - name: Push client-portal image
        run: docker push ${{ env.DOCKERHUB_USERNAME }}/racko-client-portal:qa

  build-create-vm-catalog-agent:
    name: Build & Push create-vm-catalog-agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build create-vm-catalog-agent image
        run: docker build -t ${{ env.DOCKERHUB_USERNAME }}/racko-create-vm-catalog-agent:qa -f create-vm-catalog-agent/Dockerfile create-vm-catalog-agent/

      - name: Push create-vm-catalog-agent image
        run: docker push ${{ env.DOCKERHUB_USERNAME }}/racko-create-vm-catalog-agent:qa

  build-agent:
    name: Build Agent Binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            output: racko-agent
            goos: linux
            goarch: amd64
            ldflags: '-X github.com/racko-ai/agent/config.LDPlatformURL=https://api-qa.racko.ai -X github.com/racko-ai/agent/config.Version=${{ github.sha }}'
          - os: windows-latest
            platform: windows
            output: racko-agent.exe
            goos: windows
            goarch: amd64
            ldflags: '-X github.com/racko-ai/agent/config.LDPlatformURL=https://api-qa.racko.ai -X github.com/racko-ai/agent/config.Version=${{ github.sha }} -H windowsgui'
            ldflags_url: 'https://api-qa.racko.ai'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod

      - name: Build agent binary
        working-directory: agent
        shell: bash
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -ldflags "${{ matrix.ldflags }}" -o dist/${{ matrix.output }} .

      - name: Compute and save checksum (Linux)
        if: matrix.platform == 'linux'
        working-directory: agent
        shell: bash
        run: |
          CHECKSUM=$(sha256sum dist/racko-agent | awk '{print $1}')
          echo "AGENT_CHECKSUM_LINUX=$CHECKSUM" >> $GITHUB_STEP_SUMMARY
          echo "$CHECKSUM" > dist/checksum-linux.txt

      - name: Compute and save checksum (Windows)
        if: matrix.platform == 'windows'
        working-directory: agent
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/racko-agent.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Windows binary SHA256: $hash"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "AGENT_CHECKSUM_WINDOWS=$hash"
          Set-Content -Path dist/checksum-windows.txt -Value $hash

      - name: Build Windows installer (Windows only)
        if: matrix.platform == 'windows'
        working-directory: agent
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DPlatformURL=${{ matrix.ldflags_url }}" "installer\racko-agent-setup.iss"

      - name: Upload binary as artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.platform }}
          path: |
            agent/dist/${{ matrix.output }}
            agent/dist/checksum-${{ matrix.platform }}.txt
            ${{ matrix.platform == 'windows' && 'agent/dist/racko-agent-setup.exe' || '' }}
          retention-days: 1

  deploy-agent:
    name: Deploy Agent Binaries
    runs-on: [self-hosted, linux, racko-qa]
    needs: build-agent
    steps:
      - name: Download all agent artifacts
        uses: actions/download-artifact@v4
        with:
          path: agent-artifacts

      - name: Install agent binaries
        run: |
          set -e
          sudo mkdir -p "${DEPLOY_PATH}/agent/dist"
          sudo cp agent-artifacts/agent-linux/racko-agent \
            "${DEPLOY_PATH}/agent/dist/racko-agent"
          sudo chmod +x "${DEPLOY_PATH}/agent/dist/racko-agent"
          sudo cp agent-artifacts/agent-windows/racko-agent.exe \
            "${DEPLOY_PATH}/agent/dist/racko-agent.exe"
          sudo cp agent-artifacts/agent-windows/racko-agent-setup.exe \
            "${DEPLOY_PATH}/agent/dist/racko-agent-setup.exe"
          echo "Agent binaries installed to ${DEPLOY_PATH}/agent/dist/"

      - name: Update agent version and checksums in server .env
        run: |
          set -e
          CHECKSUM_WINDOWS=$(cat agent-artifacts/agent-windows/checksum-windows.txt)
          CHECKSUM_LINUX=$(cat agent-artifacts/agent-linux/checksum-linux.txt)
          AGENT_VERSION="${{ github.sha }}"
          ENV_FILE="${DEPLOY_PATH}/core-api/.env"

          echo "Updating core-api .env: AGENT_VERSION=$AGENT_VERSION"

          update_env() {
            KEY=$1; VALUE=$2
            if grep -q "^${KEY}=" "${ENV_FILE}" 2>/dev/null; then
              sudo sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" "${ENV_FILE}"
            else
              echo "${KEY}=${VALUE}" | sudo tee -a "${ENV_FILE}" > /dev/null
            fi
          }

          update_env "AGENT_VERSION"          "${AGENT_VERSION}"
          update_env "AGENT_CHECKSUM_WINDOWS" "${CHECKSUM_WINDOWS}"
          update_env "AGENT_CHECKSUM_LINUX"   "${CHECKSUM_LINUX}"
          echo "core-api/.env updated with new agent version and checksums"

  deploy:
    name: Deploy to QA
    runs-on: [self-hosted, linux, racko-qa]
    needs:
      - build-core-api
      - build-cloud-gateway
      - build-cloud-automation
      - build-cloud-automation-aws
      - build-cloud-automation-reseller
      - build-client-portal
      - build-create-vm-catalog-agent
      - deploy-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install compose file
        run: |
          set -e
          sudo mkdir -p "${DEPLOY_PATH}"
          sudo cp docker-compose-qa.yml "${DEPLOY_PATH}/docker-compose.yml"
          echo "docker-compose-qa.yml installed to ${DEPLOY_PATH}/docker-compose.yml"

      - name: Deploy (pull new images + restart)
        run: |
          set -e
          echo 'Cleaning up Docker system...'
          sudo docker system prune -a --volumes -f
          sudo docker container prune -f
          sudo docker image prune -a -f
          sudo docker volume prune -f
          echo 'Cleaning Docker logs...'
          sudo find /var/lib/docker/containers -name '*.log' -delete || true
          echo 'Cleaning journal logs...'
          sudo journalctl --vacuum-size=100M || true
          echo 'Cleaning apt cache...'
          sudo apt clean || true
          sudo apt autoclean || true
          echo 'Disk usage after cleanup:'
          df -h
          export DOCKERHUB_USERNAME="${DOCKERHUB_USERNAME}"
          export IMAGE_TAG=qa
          echo 'Docker login...'
          echo "${DOCKERHUB_TOKEN}" | sudo docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
          echo 'Deploying...'
          sudo docker compose -f "${DEPLOY_PATH}/docker-compose.yml" down --remove-orphans
          sudo docker compose -f "${DEPLOY_PATH}/docker-compose.yml" pull
          sudo docker compose -f "${DEPLOY_PATH}/docker-compose.yml" up -d
          sudo docker compose -f "${DEPLOY_PATH}/docker-compose.yml" ps

      - name: Summary
        run: |
          echo "Build & Deploy QA Complete!"
          echo "Deploy path: ${DEPLOY_PATH}"
          echo "Client portal:  http://localhost:3000"
          echo "Cloud gateway:  http://localhost:8000"
          echo "Core API:       http://localhost:8001"
          echo "Azure service:  http://localhost:3002"
          echo "AWS service:    http://localhost:3003"
          echo "Reseller svc:   http://localhost:3005"
